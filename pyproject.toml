[project]
name = "pyremu"
version = "0.10.0"
description = "a riscv emulator"
readme = "docs/README.md"
requires-python = ">=3.14.15"

## 命令备忘录
# uv lock
# uv export -o requirements.txt
# uv pip freeze > requirements.txt

dependencies = [
    "lief==1.0.0",
    "loguru==0.7.3",
    "prompt-toolkit==3.0.53",
    "pyfdt==0.3",
    "pylibfdt==1.7.2.post2",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "libfsapfs-python==20260921",
    "libfshfs-python==20260922",
    "libfsntfs-python==20260827",
]


[project.scripts]
rvdb = "pyremu.debugger:debugger"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "vulture>=2.16",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "build==1.6.1",
    "setuptools==84.0.0",
    "openpyxl==3.1.5",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["pyremu*"]
namespaces = false

[tool.setuptools.package-data]
"pyremu._native" = ["libdecode.so", "libtermio.so", "ffi_spec.json"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

# https://setuptools.pypa.io/en/latest/build_meta.html
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# setup for pytest
pythonpath = "."
timeout = 10
# timeout_func_only = true
testpaths = ["tests"]
norecursedirs = [
	"vendor",
	".git",
	"to-read",
	"output",
	"__pycache__",
	".venv"
]

[tool.ruff]
indent-width = 4
line-length = 80
extend-exclude = [
    "vendor",
    "bsp",
	"build",
	"docs",
]

[tool.ruff.lint]
select = [
    "F",
    "E",
	"ERA",
    "N",
    "I",
    "W",
	"E701",
    "PL",
    "PERF",
	"PLC0415",
]
ignore=[
    "E731",
    "PLR2004"
]

[tool.ruff.lint.pylint]
max-nested-blocks = 4

[tool.ruff.lint.isort]
order-by-type = false
force-single-line = false
combine-as-imports = true
force-sort-within-sections = true
# 多行导入按字典序排
split-on-trailing-comma = true
# 分组划分: 标准库 / 第三方 / 本地项目 / 相对导入

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.vulture]
exclude = [
    "venv",
    ".venv",
	".vscode",
	".github",
	".ruff_cache",
	"bsp",
    "build",
	"dist",
	"docs",
	"examples",
	"output",
	"vendor",
	"to-read",
    "migrations",
]
